name: CCHH Mobile - Android Emulator Smoke
on:
  push:
    branches:
      - feat/cchh-mobile-android-build-20261019
    paths:
      - '.github/workflows/cchh-mobile-emulator-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: CCHH-Mobile-v0.1.5-Android-APK
          run-id: 39196822855
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Verify downloaded APK SHA-256
        run: cd apk && sed 's|artifacts/||' SHA256SUMS.txt | sha256sum -c
      - name: Enable KVM
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install APK and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r apk/CCHH-Mobile-v0.1.5.apk
            adb shell am start -n com.cchh.mobile.client/.MainActivity
            sleep 20
            adb shell pidof com.cchh.mobile.client
            # Capture directly to the CI filesystem: /sdcard is not writable in some emulators.
            adb exec-out screencap -p > cchh-mobile-smoke.png
            test -s cchh-mobile-smoke.png
            file cchh-mobile-smoke.png | grep -q 'PNG image data'
            adb logcat -d -v time > cchh-mobile-logcat.txt
            timeout 90s adb shell uiautomator dump /data/local/tmp/cchh-mobile-ui.xml
            adb exec-out cat /data/local/tmp/cchh-mobile-ui.xml > cchh-mobile-ui.xml
            grep -q 'CCHH Mobile' cchh-mobile-ui.xml
            adb shell pidof com.cchh.mobile.client
      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CCHH-Mobile-v0.1.5-Emulator-Smoke
          path: |
            cchh-mobile-smoke.png
            cchh-mobile-ui.xml
            cchh-mobile-logcat.txt
          if-no-files-found: warn
          retention-days: 7
