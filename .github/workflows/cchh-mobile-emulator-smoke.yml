name: CCHH Mobile - Android Emulator Smoke
on:
  push:
    branches:
      - feat/cchh-mobile-android-build-20261019
      - feat/cchh-mobile-community-pairing-20261019
    paths:
      - '.github/workflows/cchh-mobile-emulator-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  emulator-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Resolve latest successful APK build
        id: apk
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow cchh-mobile-apk.yml \
            --branch "$GITHUB_REF_NAME" --status success --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          test -n "$run_id"
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: CCHH-Mobile-v0.1.5-Android-APK
          run-id: ${{ steps.apk.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Verify downloaded APK SHA-256
        run: cd apk && sed 's|artifacts/||' SHA256SUMS.txt | sha256sum -c
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install repository dependencies
        run: bun install --frozen-lockfile
      - name: Start isolated CCHH server
        run: |
          set -euo pipefail
          isolated=$(mktemp -d)
          mkdir -p "$isolated/home" "$isolated/config"
          HOME="$isolated/home" CLAUDE_CONFIG_DIR="$isolated/config" \
            CCHH_E2E_INFO="$GITHUB_WORKSPACE/cchh-e2e-info.json" \
            nohup bun run cchh-mobile-android/tests/e2eServer.ts > "$GITHUB_WORKSPACE/cchh-e2e-server.log" 2>&1 &
          for _ in $(seq 1 90); do
            test -s "$GITHUB_WORKSPACE/cchh-e2e-info.json" && exit 0
            sleep 2
          done
          cat "$GITHUB_WORKSPACE/cchh-e2e-server.log"
          exit 1
      - name: Enable KVM
        run: |
          sudo sh -c 'echo KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node" > /etc/udev/rules.d/99-kvm4all.rules'
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo chmod 0666 /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Install APK and launch on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            adb install -r apk/CCHH-Mobile-v0.1.5.apk
            # Launches, dismisses system ANR dialogs, and writes screenshot + XML.
            python3 cchh-mobile-android/tests/emulatorSmoke.py connect
            adb shell pidof com.cchh.mobile.client
            test -s cchh-mobile-smoke.png
            file cchh-mobile-smoke.png | grep -q 'PNG image data'
            grep -q 'CCHH Mobile' cchh-mobile-ui.xml
            adb logcat -d -v time > cchh-mobile-logcat.txt
            # Background and resume through the Android lifecycle.
            python3 cchh-mobile-android/tests/emulatorSmoke.py resume
            adb shell pidof com.cchh.mobile.client
            test -s cchh-mobile-resume.png
            file cchh-mobile-resume.png | grep -q 'PNG image data'
            grep -q 'CCHH Mobile' cchh-mobile-resume-ui.xml
            # Connect to the isolated host server, send one task over the real
            # WebSocket, and confirm the reply survives a foreground resume.
            info=cchh-e2e-info.json
            port=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["port"])' "$info")
            token=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["token"])' "$info")
            python3 cchh-mobile-android/tests/emulatorSmoke.py chat "http://10.0.2.2:$port" "$token"
            adb logcat -d -v time > cchh-mobile-logcat.txt
      - name: Show isolated server log
        if: always()
        run: |
          if [ -f cchh-e2e-server.log ]; then
            tail -n 120 cchh-e2e-server.log
          fi
      - name: Upload emulator screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CCHH-Mobile-v0.1.5-Emulator-Smoke
          path: |
            cchh-mobile-smoke.png
            cchh-mobile-ui.xml
            cchh-mobile-logcat.txt
            cchh-mobile-resume.png
            cchh-mobile-resume-ui.xml
            cchh-e2e-server.log
          if-no-files-found: warn
          retention-days: 7
