name: CCHH Mobile · Android Test APK
on:
  push:
    branches:
      - feat/cchh-mobile-android-build-20261019
    paths:
      - 'cchh-mobile-android/**'
      - '.github/workflows/cchh-mobile-apk.yml'
  workflow_dispatch:
concurrency:
  group: cchh-mobile-apk-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: cchh-mobile-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/platforms"
      - name: Install app dependencies
        run: npm install --no-audit --no-fund
      - name: Run native remote pairing protocol tests
        run: npm test
      - name: Validate Expo dependencies
        run: npx expo install --check
      - name: Generate isolated Android native project
        run: npx expo prebuild --platform android --clean --non-interactive --no-install
      - name: Assemble standalone release APK
        run: cd android && chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon --stacktrace
      - name: Verify/sign test build & calculate SHA-256
        run: |
          set -euo pipefail
          mkdir -p artifacts
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          if "$APKSIGNER" verify "$APK" >/dev/null 2>&1; then
            cp "$APK" artifacts/CCHH-Mobile-v0.1.5.apk
          else
            keytool -genkeypair -keystore /tmp/cchh-test.jks -alias cchh -storepass changeit -keypass changeit -dname "CN=CCHH Mobile Test" -keyalg RSA -keysize 3072 -validity 3650 -noprompt
            "$APKSIGNER" sign --ks /tmp/cchh-test.jks --ks-key-alias cchh --ks-pass pass:changeit --key-pass pass:changeit --out artifacts/CCHH-Mobile-v0.1.5.apk "$APK"
            rm -f /tmp/cchh-test.jks
          fi
          "$APKSIGNER" verify artifacts/CCHH-Mobile-v0.1.5.apk
          sha256sum artifacts/CCHH-Mobile-v0.1.5.apk > artifacts/SHA256SUMS.txt
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: CCHH-Mobile-v0.1.5-Android-APK
          path: |
            cchh-mobile-android/artifacts/*.apk
            cchh-mobile-android/artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
